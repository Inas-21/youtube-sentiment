[project]
name = "youtube-sentiment"
version = "0.1.0"
description = "Analyse de sentiment des commentaires YouTube : modèle TF-IDF + LogReg, API FastAPI, extension Chrome"
requires-python = ">=3.10,<3.11"
dependencies = [
    "emoji>=2.16.0",
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "numpy>=2.2.6",
    "scikit-learn>=1.7.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
